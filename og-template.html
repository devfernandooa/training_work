<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OG Image Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            font-family: 'Barlow', sans-serif;
        }

        .og-image {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1c7ed6 0%, #0b2d4a 60%, #ff7b00 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .og-image::before {
            content: '';
            position: absolute;
            top: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 123, 0, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }

        .og-image::after {
            content: '';
            position: absolute;
            bottom: -200px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(28, 126, 214, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: #ff7b00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 0 40px rgba(255, 123, 0, 0.6);
        }

        .logo-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 56px;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .logo-text .blue { color: #4fa8f5; }
        .logo-text .orange { color: #ff922b; }

        .title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 76px;
            line-height: 1;
            letter-spacing: -0.01em;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .title .orange { color: #ff922b; }

        .subtitle {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.3;
            opacity: 0.95;
            margin-bottom: 60px;
            position: relative;
            z-index: 1;
            max-width: 900px;
        }

        .footer-info {
            display: flex;
            gap: 40px;
            font-size: 22px;
            font-weight: 500;
            opacity: 0.9;
            position: relative;
            z-index: 1;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .footer-info span {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="og-image">
        <div class="logo-area">
            <div class="logo-icon">🎓</div>
            <div class="logo-text">
                <span class="blue">TRAINING</span> <span class="orange">WORK</span>
            </div>
        </div>

        <div class="title">
            Cursos de <span class="orange">Fibra Óptica</span><br>
            e Normas Regulamentadoras
        </div>

        <div class="subtitle">
            Certificação válida em todo o Brasil | Turmas presenciais e In Company
        </div>

        <div class="footer-info">
            <span>📍 Feira de Santana - BA</span>
            <span>📱 (75) 9 9999-9999</span>
            <span>🌐 trainingwork.com.br</span>
        </div>
    </div>

</body>
</html>
