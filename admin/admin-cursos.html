<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrículas - Training Work</title>

  <!-- O Bootstrap CSS entra primeiro para garantir o layout correto dos grids e modais -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <!-- O style.css entra POR ÚLTIMO para aplicar a sua fonte padrão com prioridade -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/base.css">
</head>

</head>

<body id="app-container">
  <nav class="sidebar p-3 d-flex flex-column">
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-white m-0">TrainingWork</h4>
        <button class="btn btn-sm btn-outline-light d-lg-none rounded-circle p-2" id="sidebarClose" type="button"
          style="width: 36px; height: 36px;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="d-flex align-items-center justify-content-between pt-2 border-top border-secondary">
        <div class="text-white small text-truncate pe-2">
          <i class="fas fa-user me-1 text-secondary"></i> <span id="user-name">Fernando</span>
        </div>
        <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" id="btnLogout" title="Sair do sistema">
          <i class="fas fa-sign-out-alt"></i> Sair
        </button>
      </div>
    </div>

    <ul class="nav flex-column gap-2">
      <li class="nav-item">
        <a href="dashboard.html" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="fas fa-chart-line fa-fw"></i> Leads & Triagem
        </a>
      </li>
      <li class="nav-item">
        <a href="cursos.html" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="fas fa-book fa-fw"></i> Cursos
        </a>
      </li>
      <li class="nav-item">
        <a href="admin-cursos.html" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="fa-solid fa-play"></i> Em Andamento
        </a>
      </li>
      <li class="nav-item">
        <a href="alunos.html" class="nav-link text-white active d-flex align-items-center gap-2">
          <i class="fas fa-user-graduate fa-fw"></i> Alunos
        </a>
      </li>
      <li class="nav-item">
        <a href="matriculas.html" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="fas fa-file-signature fa-fw"></i> Matrículas
        </a>
      </li>
    </ul>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="d-lg-none mb-3">
      <button class="btn btn-dark btn-sm px-3 py-2 rounded-3 shadow-sm" id="sidebarToggle" type="button">
        <i class="fas fa-bars me-1"></i> Menu
      </button>
    </div>
    <header class="topbar">
      <div>
        <h1>Cursos Em Andamento:</h1>
        <p style="color: #64748b; font-size: 0.9rem;">Gerencie turmas, ementas, professores e catálogo oficial</p>
      </div>
      <button id="btn-novo-curso" class="btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-plus"></i> Novo Curso
      </button>
    </header>

    <!-- Cards de Cursos em Andamento -->
    <h2 style="font-size: 1.15rem; margin-bottom: 1rem; color: #334155;">
      <h5 class="fw-bold text-dark mb-3"><i class="fas fa-chalkboard-teacher"></i> Turmas em Andamento</h5>
    </h2>
    <div class="mb-4">


      <!-- Grid do Bootstrap onde o JS injeta dinamicamente os cards -->
      <div class="row" id="turmasEmAndamentoGrid"></div>
    </div>
  </main>

  <!-- Modal de Cadastro / Edição de Curso -->
  <div id="modal-curso" class="modal-overlay" style="display: none;">
    <div class="modal-box modal-box-large">
      <div class="modal-header-curso">
        <h3 id="modal-curso-titulo">Novo Treinamento</h3>
        <button id="modal-curso-fechar" class="btn-fechar">&times;</button>
      </div>

      <form id="form-curso">
        <input type="hidden" id="curso-id">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="curso-nome">Nome do Curso *</label>
            <input type="text" id="curso-nome" required placeholder="Ex: NR10 - Segurança em Eletricidade">
          </div>
          <div class="form-group flex-1">
            <label for="curso-slug">Código / Identificador *</label>
            <input type="text" id="curso-slug" required placeholder="Ex: nr10-basico">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="curso-carga">Carga Horária (horas) *</label>
            <input type="number" id="curso-carga" required placeholder="40">
          </div>
          <div class="form-group flex-1">
            <label for="curso-valor">Valor Base (R$) *</label>
            <input type="number" step="0.01" id="curso-valor" required placeholder="280.00">
          </div>
          <div class="form-group flex-1">
            <label for="curso-modalidade">Modalidade</label>
            <select id="curso-modalidade">
              <option value="Presencial">Presencial</option>
              <option value="Semipresencial">Semipresencial</option>
              <option value="Online">Online</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="curso-professor">Professor / Instrutor Responsável</label>
            <input type="text" id="curso-professor" placeholder="Ex: Eng. Carlos Silva">
          </div>
          <div class="form-group flex-1">
            <label for="curso-status">Status</label>
            <select id="curso-status">
              <option value="ativo">Ativo (Em catálogo)</option>
              <option value="em_andamento">Turma em Andamento</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="curso-descricao">Descrição do Curso *</label>
          <textarea id="curso-descricao" rows="3" required
            placeholder="Resumo do objetivo técnico do curso..."></textarea>
        </div>

        <div class="form-group">
          <label for="curso-ementa">Ementa / Tópicos (um por linha)</label>
          <textarea id="curso-ementa" rows="4"
            placeholder="Módulo 1: Riscos e perigos&#10;Módulo 2: EPI e EPC&#10;Módulo 3: Primeiros socorros"></textarea>
        </div>

        <div class="modal-actions" style="margin-top: 1.5rem;">
          <button type="button" id="btn-cancelar-curso" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-salvar-curso" class="btn-primary">Salvar Curso</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Edição de Curso / Turma -->
  <div class="modal fade" id="editarCursoModal" tabindex="-1" aria-labelledby="editarCursoModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header bg-dark text-white rounded-top-4">
          <h5 class="modal-title fw-bold" id="editarCursoModalLabel">Editar Turma / Curso</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formEditarCurso">
            <input type="hidden" id="editCursoId">

            <div class="mb-3">
              <label for="editNomeCurso" class="form-label fw-semibold small">Nome do Curso</label>
              <input type="text" class="form-control" id="editNomeCurso" required>
            </div>

            <div class="mb-3">
              <label for="editSiglaCurso" class="form-label fw-semibold small">Sigla</label>
              <input type="text" class="form-control" id="editSiglaCurso">
            </div>

            <div class="mb-3">
              <label for="editInstrutorCurso" class="form-label fw-semibold small">Instrutor</label>
              <input type="text" class="form-control" id="editInstrutorCurso">
            </div>
            <!-- Seção de Gerenciamento de Alunos -->
            <hr class="my-4">
            <h6 class="fw-bold text-dark mb-3"><i class="bi bi-people-fill me-1"></i> Alunos na Turma</h6>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Matriculados atualmente:</label>
              <ul id="listaAlunosMatriculados" class="list-group mb-2"
                style="max-height: 130px; overflow-y: auto; font-size: 0.85rem;">
                <li class="list-group-item text-muted">Nenhum aluno matriculado.</li>
              </ul>
            </div>

            <div class="mb-3">
              <label for="selectAlunoDisponivel" class="form-label small fw-semibold text-muted">Adicionar Aluno
                Disponível (Sem vínculo):</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="selectAlunoDisponivel">
                  <option value="">Selecione um aluno...</option>
                </select>
                <button class="btn btn-outline-success" type="button" id="btnVincularAluno">Matricular</button>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editCargaCurso" class="form-label fw-semibold small">Carga Horária (h)</label>
                <input type="number" class="form-control" id="editCargaCurso">
              </div>
              <div class="col-md-6 mb-3">
                <label for="editStatusCurso" class="form-label fw-semibold small">Status</label>
                <select class="form-select" id="editStatusCurso">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="editDescricaoCurso" class="form-label fw-semibold small">Descrição</label>
              <textarea class="form-control" id="editDescricaoCurso" rows="3"></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-2">
              <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary rounded-pill px-4">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin-cursos.js"></script>
  <script type="module" src="js/modules/sidebar.js"></script>
</body>

</html>
