<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Training Work Admin</title>

  <!-- Google Fonts: Barlow e Barlow Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome para ícones opcionais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Ajuste o caminho do CSS caso esteja dentro da pasta admin -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <div class="login-card">
    <!-- Espaço para a Logo -->
    <div class="login-logo-container">
      <img src="/img/logo_2.jpeg" alt="Training Work Logo" class="login-logo" id="admin-logo" >
      <!-- Caso prefira usar apenas um ícone se não tiver a imagem pronta: -->
      <!-- <div class="logo-fallback-icon"><i class="fas fa-graduation-cap"></i></div> -->
    </div>

    <div class="login-header">
      <h2>
        <span class="brand-training">Training</span><span class="brand-work">Work</span>
      </h2>
      <span class="brand-subtitle">Painel Administrativo</span>
    </div>

    <div id="error-msg" class="error-box"></div>
    
    <!-- Formulário continua igual... -->

    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" required placeholder="admin@trainingwork.com.br">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="btn-submit">
        <span>Entrar no Painel</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>
    <form id="login-form">
      <!-- (Campos de e-mail, senha e botão entrar continuam iguais) -->
    </form>

    <!-- Botão de Voltar para a Home -->
    <div class="login-footer-back">
      <a href="../index.html" class="back-home-link">
        <i class="fas fa-arrow-left"></i> Voltar para a página inicial
      </a>
    </div>
  </div>
  </div>
  

  <script type="module" src="js/login.js"></script>
</body>

</html>
