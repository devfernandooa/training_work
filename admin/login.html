<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Training Work Admin</title>

 <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <div class="login-card">
    <h2>Training Work Admin</h2>
    <div id="error-msg" class="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <input type="email" id="email" required placeholder="admin@trainingwork.com.br">
        </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" id="btn-submit">Entrar no Painel</button>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>

</html>
