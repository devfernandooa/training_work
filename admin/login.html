<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Training Work Admin</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <div class="login-card">
    <h2>Training Work Admin</h2>
    <div id="error-msg" class="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <input type="email" id="email" required placeholder="admin@trainingwork.com.br">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-submit">Entrar no Painel</button>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>

</html>
